<script>

    let gameState = 'MENU';
    let mazeSize = 10;
    let map = [];
    let explored = [];
    let trailMap = [];
    
    let player = { x: 1, y: 1, dir: 0 };
    let startPos = { x: 1, y: 1 };
    let goalPos = { x: 1, y: 1 };
    let isMoving = false;
    let modalType = null; // null / 'quit' / 'victory' / 'map'
    const menuSizes = [10, 20, 30];
    let menuIndex = 0;

    const dx = [0, 1, 0, -1];
    const dy = [-1, 0, 1, 0];

    // ================= 材質（程式產生，無圖片檔） =================
    const TEX_SIZE = 128;
    const START_RGB = [230, 170, 30];
    const GOAL_RGB = [40, 200, 90];
    const TEX = (() => {
        const S = TEX_SIZE;
        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        function mk() {
            const c = document.createElement('canvas');
            c.width = c.height = S;
            return { c, g: c.getContext('2d') };
        }
        // 在 3x3 位置各畫一次，讓跨邊界的圖形能無縫重複
        function wrap(x, y, fn) {
            for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) fn(x + ox, y + oy);
        }
        function grain(g, amt, r) {
            const d = g.getImageData(0, 0, S, S), a = d.data;
            for (let i = 0; i < a.length; i += 4) {
                const n = (r() - 0.5) * amt;
                a[i] += n; a[i + 1] += n; a[i + 2] += n;
            }
            g.putImageData(d, 0, 0);
        }
        function blots(g, r, n, rmin, rmax, colFn) {
            for (let i = 0; i < n; i++) {
                const x = r() * S, y = r() * S, rad = rmin + r() * (rmax - rmin);
                const [cr, cg, cb, ca] = colFn(r);
                wrap(x, y, (px, py) => {
                    const gr = g.createRadialGradient(px, py, 0, px, py, rad);
                    gr.addColorStop(0, `rgba(${cr},${cg},${cb},${ca})`);
                    gr.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
                    g.fillStyle = gr;
                    g.fillRect(px - rad, py - rad, rad * 2, rad * 2);
                });
            }
        }
        function cracks(g, r, n, len, color) {
            g.strokeStyle = color; g.lineWidth = 1;
            for (let i = 0; i < n; i++) {
                let x = r() * S, y = r() * S;
                g.beginPath(); g.moveTo(x, y);
                for (let j = 0; j < len; j++) { x += (r() - 0.5) * 10; y += (r() - 0.5) * 10; g.lineTo(x, y); }
                g.stroke();
            }
        }
        function bevel(g, x, y, w, h, s, light, dark) {
            g.fillStyle = light; g.fillRect(x, y, w, s); g.fillRect(x, y, s, h);
            g.fillStyle = dark;  g.fillRect(x, y + h - s, w, s); g.fillRect(x + w - s, y, s, h);
        }
        function waveLine(g, horizontal, base, amp, n, ph) {
            g.beginPath();
            for (let t = 0; t <= S; t += 2) {
                const o = base + Math.sin(t / S * Math.PI * 2 * n + ph) * amp;
                const [x, y] = horizontal ? [t, o] : [o, t];
                t === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
            }
            g.stroke();
        }

        // ----- 牆壁 -----
        function texBrick(r) {
            const { c, g } = mk();
            g.fillStyle = '#3a332e'; g.fillRect(0, 0, S, S);
            const rows = 8, cols = 4, bh = S / rows, bw = S / cols;
            for (let row = 0; row < rows; row++) {
                const off = (row % 2) * bw / 2;
                const cs = [];
                for (let i = 0; i < cols; i++) cs.push(`hsl(${8 + r() * 12},${38 + r() * 20}%,${26 + r() * 12}%)`);
                for (let i = -1; i <= cols; i++) {
                    const idx = ((i % cols) + cols) % cols;
                    const x = i * bw + off, y = row * bh;
                    g.fillStyle = cs[idx];
                    g.fillRect(x + 1.5, y + 1.5, bw - 3, bh - 3);
                    bevel(g, x + 1.5, y + 1.5, bw - 3, bh - 3, 1.5, 'rgba(255,225,200,.12)', 'rgba(0,0,0,.32)');
                }
            }
            blots(g, r, 14, 8, 22, () => [20, 10, 5, 0.25]);
            grain(g, 30, r);
            return c;
        }
        function texStone(r) {
            const { c, g } = mk();
            g.fillStyle = '#2a2c30'; g.fillRect(0, 0, S, S);
            const rows = 4, cols = 2, bh = S / rows, bw = S / cols;
            for (let row = 0; row < rows; row++) {
                const off = (row % 2) * bw / 2;
                const cs = [];
                for (let i = 0; i < cols; i++) cs.push(`hsl(210,${5 + r() * 8}%,${32 + r() * 12}%)`);
                for (let i = -1; i <= cols; i++) {
                    const idx = ((i % cols) + cols) % cols;
                    const x = i * bw + off, y = row * bh;
                    g.fillStyle = cs[idx];
                    g.fillRect(x + 2, y + 2, bw - 4, bh - 4);
                    bevel(g, x + 2, y + 2, bw - 4, bh - 4, 2, 'rgba(255,255,255,.14)', 'rgba(0,0,0,.42)');
                }
            }
            blots(g, r, 10, 6, 18, () => [0, 0, 0, 0.25]);
            blots(g, r, 6, 6, 16, () => [60, 95, 40, 0.28]);
            cracks(g, r, 5, 6, 'rgba(0,0,0,.45)');
            grain(g, 36, r);
            return c;
        }
        function texMetal(r) {
            const { c, g } = mk();
            g.fillStyle = '#1c2126'; g.fillRect(0, 0, S, S);
            const P = S / 2;
            for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
                const x = i * P, y = j * P;
                g.fillStyle = `hsl(205,${8 + r() * 6}%,${30 + r() * 6}%)`;
                g.fillRect(x + 1, y + 1, P - 2, P - 2);
                bevel(g, x + 1, y + 1, P - 2, P - 2, 2, 'rgba(255,255,255,.12)', 'rgba(0,0,0,.45)');
            }
            for (let i = 0; i < 260; i++) {
                const x = r() * S, y = (r() * S) | 0, len = 10 + r() * 40;
                g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)';
                g.fillRect(x, y, len, 1); g.fillRect(x - S, y, len, 1);
            }
            blots(g, r, 7, 5, 14, () => [130, 65, 25, 0.3]);
            for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
                for (const [ox, oy] of [[7, 7], [P - 7, 7], [7, P - 7], [P - 7, P - 7]]) {
                    const x = i * P + ox, y = j * P + oy;
                    g.fillStyle = '#0f1215'; g.beginPath(); g.arc(x + 0.8, y + 0.8, 2.8, 0, 7); g.fill();
                    g.fillStyle = '#8b97a2'; g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill();
                    g.fillStyle = '#d4dce3'; g.beginPath(); g.arc(x - 0.8, y - 0.8, 0.9, 0, 7); g.fill();
                }
            }
            grain(g, 12, r);
            return c;
        }
        function texWoodWall(r) {
            const { c, g } = mk();
            g.fillStyle = '#1a120c'; g.fillRect(0, 0, S, S);
            const n = 4, bw = S / n;
            for (let p = 0; p < n; p++) {
                const x0 = p * bw;
                g.fillStyle = `hsl(${24 + r() * 8},${38 + r() * 12}%,${20 + r() * 9}%)`;
                g.fillRect(x0 + 1, 0, bw - 2, S);
                g.save(); g.beginPath(); g.rect(x0 + 1, 0, bw - 2, S); g.clip();
                for (let j = 0; j < 9; j++) {
                    g.strokeStyle = `rgba(0,0,0,${0.12 + r() * 0.15})`; g.lineWidth = 1;
                    waveLine(g, false, x0 + 2 + r() * (bw - 4), 1 + r() * 2.5, 1 + ((r() * 3) | 0), r() * 6.28);
                }
                if (r() < 0.6) {
                    const kx = x0 + 8 + r() * (bw - 16), ky = 12 + r() * (S - 24);
                    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(kx, ky, 3, 5, 0, 0, 7); g.fill();
                    g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(kx, ky, 5, 8, 0, 0, 7); g.stroke();
                }
                g.restore();
                g.fillStyle = 'rgba(255,220,180,.07)'; g.fillRect(x0 + 1, 0, 1, S);
            }
            grain(g, 14, r);
            return c;
        }

        // ----- 地板 -----
        function texTile(r) {
            const { c, g } = mk();
            g.fillStyle = '#121418'; g.fillRect(0, 0, S, S);
            const P = S / 2;
            for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
                const L = 30 + r() * 8 + ((i + j) % 2 ? 4 : 0);
                g.fillStyle = `hsl(215,${8 + r() * 6}%,${L}%)`;
                g.fillRect(i * P + 2, j * P + 2, P - 4, P - 4);
                bevel(g, i * P + 2, j * P + 2, P - 4, P - 4, 2, 'rgba(255,255,255,.12)', 'rgba(0,0,0,.4)');
            }
            blots(g, r, 8, 6, 18, () => [0, 0, 0, 0.22]);
            cracks(g, r, 3, 6, 'rgba(0,0,0,.4)');
            grain(g, 22, r);
            return c;
        }
        function texCobble(r) {
            const { c, g } = mk();
            g.fillStyle = '#101214'; g.fillRect(0, 0, S, S);
            const n = 6, cell = S / n;
            for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
                const cx = (i + 0.5) * cell + (r() - 0.5) * 5, cy = (j + 0.5) * cell + (r() - 0.5) * 5;
                const rx = cell * 0.42 + r() * 2, ry = cell * 0.36 + r() * 2, rot = r() * Math.PI;
                const L = 26 + r() * 14, sat = 6 + r() * 8;
                wrap(cx, cy, (x, y) => {
                    g.save(); g.translate(x, y); g.rotate(rot);
                    const gr = g.createRadialGradient(-rx * 0.3, -ry * 0.3, 1, 0, 0, Math.max(rx, ry));
                    gr.addColorStop(0, `hsl(30,${sat}%,${L + 12}%)`);
                    gr.addColorStop(1, `hsl(30,${sat}%,${L - 8}%)`);
                    g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.fill();
                    g.restore();
                });
            }
            grain(g, 24, r);
            return c;
        }
        function texWoodFloor(r) {
            const { c, g } = mk();
            g.fillStyle = '#140d08'; g.fillRect(0, 0, S, S);
            const rows = 8, bh = S / rows, len = S / 2;
            for (let row = 0; row < rows; row++) {
                const y = row * bh, o = (r() * S) | 0;
                for (let k = 0; k < 2; k++) {
                    const col = `hsl(${26 + r() * 8},${34 + r() * 12}%,${24 + r() * 10}%)`;
                    for (const ox of [0, -S]) {
                        g.fillStyle = col; g.fillRect(o + k * len + ox + 1, y + 1, len - 2, bh - 2);
                    }
                }
                g.save(); g.beginPath(); g.rect(0, y + 1, S, bh - 2); g.clip();
                for (let j = 0; j < 4; j++) {
                    g.strokeStyle = `rgba(0,0,0,${0.12 + r() * 0.12})`; g.lineWidth = 1;
                    waveLine(g, true, y + 2 + r() * (bh - 4), 0.6 + r(), 1 + ((r() * 3) | 0), r() * 6.28);
                }
                g.restore();
                g.fillStyle = 'rgba(255,230,200,.08)'; g.fillRect(0, y + 1, S, 1);
            }
            grain(g, 14, r);
            return c;
        }
        function texDirt(r) {
            const { c, g } = mk();
            g.fillStyle = '#3a2d21'; g.fillRect(0, 0, S, S);
            const cols = [[70, 55, 40, 0.4], [30, 22, 15, 0.4], [90, 72, 50, 0.25]];
            blots(g, r, 30, 6, 20, rr => cols[(rr() * 3) | 0]);
            for (let i = 0; i < 40; i++) {
                const x = r() * S, y = r() * S, rad = 1 + r() * 1.6, L = 30 + r() * 20;
                wrap(x, y, (px, py) => {
                    g.fillStyle = `hsl(30,8%,${L}%)`; g.beginPath(); g.arc(px, py, rad, 0, 7); g.fill();
                });
            }
            grain(g, 40, r);
            return c;
        }

        // ----- 天花板 -----
        function texBeams(r) {
            const { c, g } = mk();
            g.fillStyle = '#120c08'; g.fillRect(0, 0, S, S);
            const rows = 4, bh = S / rows;
            for (let row = 0; row < rows; row++) {
                const y = row * bh;
                g.fillStyle = `hsl(25,30%,${16 + r() * 6}%)`; g.fillRect(0, y + 1, S, bh - 2);
                g.save(); g.beginPath(); g.rect(0, y + 1, S, bh - 2); g.clip();
                for (let j = 0; j < 5; j++) {
                    g.strokeStyle = `rgba(0,0,0,${0.15 + r() * 0.12})`; g.lineWidth = 1;
                    waveLine(g, true, y + 3 + r() * (bh - 6), 0.8 + r(), 1 + ((r() * 2) | 0), r() * 6.28);
                }
                g.restore();
            }
            const bx = S / 2 - 14, bw = 28;
            g.fillStyle = 'hsl(22,35%,13%)'; g.fillRect(bx, 0, bw, S);
            g.save(); g.beginPath(); g.rect(bx, 0, bw, S); g.clip();
            for (let j = 0; j < 6; j++) {
                g.strokeStyle = `rgba(0,0,0,${0.2 + r() * 0.15})`;
                waveLine(g, false, bx + 2 + r() * (bw - 4), 1 + r(), 1 + ((r() * 2) | 0), r() * 6.28);
            }
            g.restore();
            g.fillStyle = 'rgba(255,220,180,.10)'; g.fillRect(bx, 0, 2, S);
            g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(bx + bw - 2, 0, 2, S);
            grain(g, 14, r);
            return c;
        }
        function texPlaster(r) {
            const { c, g } = mk();
            g.fillStyle = '#77746d'; g.fillRect(0, 0, S, S);
            blots(g, r, 25, 8, 26, rr => rr() < 0.5 ? [255, 255, 250, 0.12] : [0, 0, 0, 0.12]);
            blots(g, r, 3, 14, 26, () => [110, 90, 50, 0.18]);
            cracks(g, r, 4, 8, 'rgba(40,35,30,.5)');
            grain(g, 20, r);
            return c;
        }
        function texGrate(r) {
            const { c, g } = mk();
            g.fillStyle = '#2b3138'; g.fillRect(0, 0, S, S);
            const n = 4, P = S / n;
            for (let i = 0; i < 200; i++) {
                const x = r() * S, y = (r() * S) | 0, len = 8 + r() * 30;
                g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)';
                g.fillRect(x, y, len, 1); g.fillRect(x - S, y, len, 1);
            }
            for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
                const x = i * P, y = j * P;
                bevel(g, x, y, P, P, 1, 'rgba(255,255,255,.10)', 'rgba(0,0,0,.35)');
                g.fillStyle = '#07090b'; g.fillRect(x + 5, y + 5, P - 10, P - 10);
                bevel(g, x + 5, y + 5, P - 10, P - 10, 2, 'rgba(0,0,0,.6)', 'rgba(255,255,255,.14)');
            }
            blots(g, r, 6, 5, 12, () => [130, 65, 25, 0.28]);
            grain(g, 12, r);
            return c;
        }

        const DEFS = {
            wall:  [['紅磚', texBrick], ['石塊', texStone], ['金屬板', texMetal], ['木板', texWoodWall]],
            floor: [['石板地磚', texTile], ['鵝卵石', texCobble], ['木地板', texWoodFloor], ['泥土', texDirt]],
            ceil:  [['木樑', texBeams], ['灰泥', texPlaster], ['金屬格柵', texGrate]],
        };
        const out = {};
        let seed = 1000;
        for (const cat in DEFS) {
            out[cat] = DEFS[cat].map(([name, fn]) => {
                const canvas = fn(mulberry32(seed += 97));
                return { name, canvas, data: canvas.getContext('2d').getImageData(0, 0, S, S).data };
            });
        }
        return out;
    })();
    // 目前使用的材質（索引），預設：石塊牆／石板地磚／灰泥天花板
    const texChoice = { wall: 1, floor: 0, ceil: 1 };

    // ================= 怪物與祭壇 =================
    // 各尺寸可選的數量範圍，與目前選擇（預設取中間值）
    const COUNT_RANGES = {
        10: { monsters: [1, 3],   altars: [1, 2] },
        20: { monsters: [5, 10],  altars: [3, 4] },
        30: { monsters: [15, 25], altars: [5, 8] },
    };
    const countChoice = {
        10: { monsters: 2,  altars: 1 },
        20: { monsters: 8,  altars: 3 },
        30: { monsters: 20, altars: 6 },
    };
    const MONSTER_TYPES = window.M3D ? Object.keys(M3D.MODELS).filter(id => M3D.MODELS[id].cat === 'monster') : [];
    // { type, x, y, px, py, fromX, fromY, moveStart, seed }
    //   px/py：上一格（避免來回抖動）；fromX/fromY + moveStart：平滑移動用的起點與開始時間
    let monsters = [];
    const MONSTER_MOVE_MS = 450;   // 每走一格的滑動時間
    let monsterIntervalSec = 1;    // 怪物每隔幾秒走一格（選單可選 1~5 秒）
    let altars = [];     // { x, y, lit }
    let monsterTimer = null, animFrameId = null, lastDraw = 0, toastTimer = null;

    const altarAt = (x, y) => altars.find(a => a.x === x && a.y === y);
    const monsterAt = (x, y) => monsters.find(m => m.x === x && m.y === y);
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    }

    // 隨機放置祭壇與怪物（避開起點、終點；怪物盡量離起點遠一點）
    function placeEntities(size) {
        const cnt = countChoice[size];
        const open = [];
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
            if (map[y][x] !== 0) continue;
            if (x === startPos.x && y === startPos.y) continue;
            if (x === goalPos.x && y === goalPos.y) continue;
            open.push({ x, y });
        }
        shuffle(open);
        altars = open.splice(0, Math.min(cnt.altars, open.length)).map(c => ({ x: c.x, y: c.y, lit: false }));
        const far = open.filter(c => Math.abs(c.x - startPos.x) + Math.abs(c.y - startPos.y) >= 4);
        const pool = far.length >= cnt.monsters ? far : open;
        const types = shuffle(MONSTER_TYPES.slice());
        monsters = pool.slice(0, cnt.monsters).map((c, i) => ({
            type: types[i % types.length], x: c.x, y: c.y, px: -1, py: -1,
            fromX: c.x, fromY: c.y, moveStart: 0, seed: i * 1.7,
        }));
    }

    // 怪物每秒沿著通道隨機走一格：只從「有路」的方向中挑，岔路隨機選，不走回頭路（死巷才回頭）
    //   可以經過祭壇與出口（迷宮只有一條路相通，擋住會把怪物困在死巷裡），可以和玩家同格，不和其他怪物重疊
    function moveMonsters() {
        if (gameState !== 'PLAYING' || modalType) return;
        const occupied = new Set(monsters.map(m => m.y * mazeSize + m.x));
        const now = performance.now();
        let hit = null;
        for (const m of monsters) {
            const opts = [];
            for (let d = 0; d < 4; d++) {
                const nx = m.x + dx[d], ny = m.y + dy[d];
                if (nx < 0 || ny < 0 || nx >= mazeSize || ny >= mazeSize || map[ny][nx] !== 0) continue;
                if (occupied.has(ny * mazeSize + nx)) continue;
                opts.push([nx, ny]);
            }
            if (!opts.length) continue;
            const ahead = opts.filter(([x, y]) => !(x === m.px && y === m.py));   // 盡量不走回頭路
            const [nx, ny] = (ahead.length ? ahead : opts)[Math.floor(Math.random() * (ahead.length || opts.length))];
            occupied.delete(m.y * mazeSize + m.x);
            occupied.add(ny * mazeSize + nx);
            m.px = m.x; m.py = m.y;
            m.fromX = m.x; m.fromY = m.y; m.moveStart = now;   // 平滑移動的起點
            m.x = nx; m.y = ny;
            if (nx === player.x && ny === player.y) hit = m;
        }
        if (hit) showToast(`碰到怪物：${M3D.MODELS[hit.type].name}！`, 'danger');
    }

    // 玩家走進新格子時檢查：怪物、祭壇
    function checkPlayerCell() {
        const m = monsterAt(player.x, player.y);
        if (m) showToast(`碰到怪物：${M3D.MODELS[m.type].name}！`, 'danger');
        const a = altarAt(player.x, player.y);
        if (a) {
            if (!a.lit) {
                a.lit = true;
                const lit = altars.filter(x => x.lit).length;
                showToast(lit === altars.length
                    ? `觸摸祭壇：祭壇發光了！全部 ${altars.length} 座都已點亮，前往出口吧！`
                    : `觸摸祭壇：祭壇發光了！（${lit} / ${altars.length}）`, 'ok');
                updateStatus();
            } else {
                showToast('這座祭壇已經發光了');
            }
        }
    }

    function showToast(text, kind = '') {
        const el = document.getElementById('toast');
        el.textContent = text;
        el.className = 'show ' + kind;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = ''; }, 2200);
    }

    function updateStatus() {
        const lit = altars.filter(a => a.lit).length;
        document.getElementById('status-info').textContent =
            `尺寸: ${mazeSize}x${mazeSize}　祭壇: ${lit} / ${altars.length}　怪物: ${monsters.length}`;
    }

    // 遊戲進行中的計時：怪物每秒移動、畫面約每秒 15 張（讓模型動起來）
    function startLoops() {
        stopLoops();
        monsterTimer = setInterval(moveMonsters, monsterIntervalSec * 1000);
        const loop = (now) => {
            animFrameId = requestAnimationFrame(loop);
            if (gameState !== 'PLAYING' || now - lastDraw < 66) return;
            lastDraw = now;
            render3DView();
        };
        animFrameId = requestAnimationFrame(loop);
    }
    function stopLoops() {
        clearInterval(monsterTimer); monsterTimer = null;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = null;
    }

    // 選單：依尺寸更新數量選項
    function refreshCountSelects() {
        const size = menuSizes[menuIndex], r = COUNT_RANGES[size];
        for (const kind of ['monsters', 'altars']) {
            const sel = document.getElementById('sel-' + kind);
            sel.innerHTML = '';
            for (let n = r[kind][0]; n <= r[kind][1]; n++) sel.add(new Option(n, n));
            sel.value = countChoice[size][kind];
        }
    }
    // 怪物移動間隔：記住上次的選擇
    function initSpeedSelect() {
        const sel = document.getElementById('sel-speed');
        try {
            const saved = +localStorage.getItem('maze-monster-interval');
            if (saved >= 1 && saved <= 5) monsterIntervalSec = saved;
        } catch (e) { /* 忽略 */ }
        sel.value = monsterIntervalSec;
        sel.addEventListener('change', () => {
            monsterIntervalSec = +sel.value;
            sel.blur();
            try { localStorage.setItem('maze-monster-interval', monsterIntervalSec); } catch (e) { /* 忽略 */ }
        });
    }

    function initCountSelects() {
        for (const kind of ['monsters', 'altars']) {
            const sel = document.getElementById('sel-' + kind);
            sel.addEventListener('change', () => {
                countChoice[menuSizes[menuIndex]][kind] = +sel.value;
                sel.blur();
            });
        }
    }

    // ================= BGM 安全容錯播放 (bgm/map_01.mp3 不存在時靜默忽略) =================
    const BGMManager = {
        audio: null,
        started: false,
        available: false,
        init(src) {
            if (!src) return;
            const audio = new Audio();
            audio.loop = true;
            audio.volume = 0.5;
            audio.addEventListener('error', () => { this.available = false; });
            audio.addEventListener('canplaythrough', () => {
                this.available = true;
                if (this.started) this.play();
            });
            audio.src = src;
            this.audio = audio;
        },
        play() {
            this.started = true;
            if (this.audio && this.available && this.audio.paused) {
                this.audio.play().catch(() => {});
            }
        }
    };
    BGMManager.init('bgm/map_01.mp3');
    window.addEventListener('pointerdown', () => BGMManager.play(), { once: true });
    window.addEventListener('keydown', () => BGMManager.play(), { once: true });

    function startGame(size) {
        BGMManager.play();
        mazeSize = size;
        generatePerfectMaze(size);
        placeEntities(size);

        player.x = startPos.x;
        player.y = startPos.y;
        player.dir = 0;
        
        explored = Array(size).fill(false).map(() => Array(size).fill(false));
        trailMap = Array(size).fill(false).map(() => Array(size).fill(false));
        
        markExplored();
        trailMap[player.y][player.x] = true;

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('map-overlay').style.display = 'none';
        document.getElementById('summary-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('controls-bar').style.display = 'flex';
        document.getElementById('toast').className = '';
        updateStatus();

        gameState = 'PLAYING';
        modalType = null;
        isMoving = false;
        updateView();
        startLoops();
    }

    // 100% 確保連通的完美迷宮生成
    function generatePerfectMaze(size) {
        map = Array(size).fill(1).map(() => Array(size).fill(1));
        let startX = 1;
        let startY = 1;

        function carve(cx, cy) {
            map[cy][cx] = 0;
            let dirs = [{x: 0, y: -2}, {x: 2, y: 0}, {x: 0, y: 2}, {x: -2, y: 0}];
            dirs.sort(() => Math.random() - 0.5);

            for (let d of dirs) {
                let nx = cx + d.x;
                let ny = cy + d.y;
                if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && map[ny][nx] === 1) {
                    map[cy + d.y / 2][cx + d.x / 2] = 0;
                    carve(nx, ny);
                }
            }
        }

        carve(startX, startY);
        startPos = { x: startX, y: startY };
        
        // BFS 計算各格到起點的實際步數
        const dist = Array(size).fill(-1).map(() => Array(size).fill(-1));
        const queue = [{ x: startX, y: startY }];
        dist[startY][startX] = 0;
        const nb = [[0, -1], [1, 0], [0, 1], [-1, 0]];
        const openCount = (x, y) => nb.filter(([ox, oy]) => map[y + oy] && map[y + oy][x + ox] === 0).length;
        while (queue.length) {
            const c = queue.shift();
            for (const [ox, oy] of nb) {
                const nx = c.x + ox, ny = c.y + oy;
                if (nx >= 0 && nx < size && ny >= 0 && ny < size && map[ny][nx] === 0 && dist[ny][nx] < 0) {
                    dist[ny][nx] = dist[c.y][c.x] + 1;
                    queue.push({ x: nx, y: ny });
                }
            }
        }

        // 終點：離起點最遠的「死巷」（只有一個出口的格子）
        let maxDist = -1;
        let bestGoal = { x: startX, y: startY };
        for (let y = 1; y < size - 1; y++) {
            for (let x = 1; x < size - 1; x++) {
                if (map[y][x] === 0 && !(x === startX && y === startY) && openCount(x, y) === 1) {
                    if (dist[y][x] > maxDist) {
                        maxDist = dist[y][x];
                        bestGoal = { x: x, y: y };
                    }
                }
            }
        }
        goalPos = bestGoal;
        map[startPos.y][startPos.x] = 0;
        map[goalPos.y][goalPos.x] = 0;
    }

    function markExplored() {
        // 以玩家為中心的九宮格都記為已走過
        for (let oy = -1; oy <= 1; oy++) {
            for (let ox = -1; ox <= 1; ox++) {
                let nx = player.x + ox;
                let ny = player.y + oy;
                if (nx >= 0 && nx < mazeSize && ny >= 0 && ny < mazeSize) {
                    explored[ny][nx] = true;
                }
            }
        }
    }

    // 滑鼠點擊後取消按鈕焦點，避免 Enter / Space 又觸發該按鈕
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (btn) btn.blur();
    });

    window.addEventListener('keydown', (e) => {
        if (e.repeat) return;

        // 彈窗開啟時，只處理彈窗按鍵
        if (gameState === 'PLAYING' && modalType) {
            if (modalType === 'quit') {
                if (e.key === 'Enter') confirmModal(true);
                else if (e.key === 'Escape') confirmModal(false);
                else return;
            } else if (modalType === 'map') {
                if (e.key === ' ' || e.key === 'Escape') closeMapView();
                else return;
            } else { // victory：Enter / ESC 都是確認
                if (e.key === 'Enter' || e.key === 'Escape') closeModalToSummary();
                else return;
            }
            e.preventDefault();
            return;
        }

        if (gameState === 'MENU') {
            if (e.key === 'ArrowLeft') { selectMenu((menuIndex + menuSizes.length - 1) % menuSizes.length); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { selectMenu((menuIndex + 1) % menuSizes.length); e.preventDefault(); }
            else if (e.key === 'Enter') { startGame(menuSizes[menuIndex]); e.preventDefault(); }
        } else if (gameState === 'PLAYING') {
            if (e.key === 'ArrowLeft') { handleAction('LEFT'); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { handleAction('RIGHT'); e.preventDefault(); }
            else if (e.key === 'ArrowUp') { handleAction('FORWARD'); e.preventDefault(); }
            else if (e.key === 'ArrowDown') { handleAction('BACKWARD'); e.preventDefault(); }
            else if (e.key === 'Escape') { handleAction('QUIT'); e.preventDefault(); }
            else if (e.key === ' ') { openMapView(); e.preventDefault(); }
        } else if (gameState === 'SUMMARY' && (e.key === 'Escape' || e.key === 'Enter')) {
            returnToMenu();
            e.preventDefault();
        }
    });

    function handleAction(action) {
        if (gameState !== 'PLAYING') return;
        if (isMoving || modalType) return;

        if (action === 'QUIT') {
            showModal('放棄遊戲', '確定要放棄並離開目前的迷宮嗎？', true);
            return;
        }

        let targetX = player.x;
        let targetY = player.y;
        let newDir = player.dir;

        if (action === 'LEFT') newDir = (player.dir + 3) % 4;
        else if (action === 'RIGHT') newDir = (player.dir + 1) % 4;
        else if (action === 'FORWARD') {
            targetX += dx[player.dir];
            targetY += dy[player.dir];
        } else if (action === 'BACKWARD') {
            targetX -= dx[player.dir];
            targetY -= dy[player.dir];
        }

        if (action === 'FORWARD' || action === 'BACKWARD') {
            if (targetX < 0 || targetX >= mazeSize || targetY < 0 || targetY >= mazeSize || map[targetY][targetX] === 1) {
                return;
            }
        }

        const moved = action === 'FORWARD' || action === 'BACKWARD';
        isMoving = true;
        player.x = targetX;
        player.y = targetY;
        player.dir = newDir;

        markExplored();
        trailMap[player.y][player.x] = true;

        if (moved) checkPlayerCell();
        updateView();

        // 出口：所有祭壇都發光才能通關
        if (moved && player.x === goalPos.x && player.y === goalPos.y) {
            const left = altars.filter(a => !a.lit).length;
            if (left === 0) {
                setTimeout(() => {
                    showModal('恭喜通關', '所有祭壇都已點亮，你成功走出迷宮！', false, true);
                }, 150);
                return;
            }
            showToast(`出口被封印：還有 ${left} 個祭壇要觸摸`, 'danger');
        }

        setTimeout(() => {
            isMoving = false;
        }, 150);
    }

    // 3D 渲染器：真透視投影 + 由遠到近（畫家演算法）逐格繪製牆面
    function render3DView() {
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');

        // 畫布像素尺寸與實際顯示尺寸同步，避免透視被拉伸變形
        const cw = canvas.clientWidth || 768;
        const ch = canvas.clientHeight || 440;
        if (canvas.width !== cw || canvas.height !== ch) {
            canvas.width = cw;
            canvas.height = ch;
        }
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        const F = h * 0.36;     // 焦距（決定視野）
        const CAM_BACK = 0;     // 鏡頭位於所在格中心：自己這一格只顯示前半格
        const NEAR = 0.05;      // 近裁切面
        const MAX_DEPTH = 4;    // 往前最多看 4 格，第 5 格起不繪製
        const MAX_SIDE = 4;     // 左右最多看幾格
        const FOG_DIST = 5;     // 霧化距離（第 4 格幾乎全暗）

        // 天花板與地板：逐列投射材質；起點（黃）／終點（綠）地板疊色
        {
            const fx = dx[player.dir], fy = dy[player.dir];
            const rx = dx[(player.dir + 1) % 4], ry = dy[(player.dir + 1) % 4];
            const floorD = TEX.floor[texChoice.floor].data;
            const ceilD = TEX.ceil[texChoice.ceil].data;
            const img = ctx.createImageData(w, h), D = img.data;
            for (let y = 0; y < h; y++) {
                const isF = y >= cy;
                const Z = 0.5 * F / (isF ? (y + 0.5 - cy) : (cy - (y + 0.5)));
                const o0 = y * w * 4;
                if (Z > MAX_DEPTH + 0.5) { // 視距外全黑
                    for (let x = 0; x < w; x++) D[o0 + x * 4 + 3] = 255;
                    continue;
                }
                const fog = Math.max(0.08, 1 - Z / FOG_DIST) * (isF ? 0.85 : 0.6);
                const T = isF ? floorD : ceilD;
                const bx = player.x + fx * Z + 0.5, by = player.y + fy * Z + 0.5, step = Z / F;
                for (let x = 0; x < w; x++) {
                    const X = (x + 0.5 - cx) * step;
                    const wx = bx + rx * X, wy = by + ry * X;
                    const ix = Math.floor(wx), iy = Math.floor(wy);
                    const ti = ((((wy - iy) * TEX_SIZE) | 0) * TEX_SIZE + (((wx - ix) * TEX_SIZE) | 0)) * 4;
                    let r = T[ti], g = T[ti + 1], b = T[ti + 2];
                    if (isF) {
                        const tint = (ix === goalPos.x && iy === goalPos.y) ? GOAL_RGB
                                   : (ix === startPos.x && iy === startPos.y) ? START_RGB : null;
                        if (tint) {
                            r = r * 0.45 + tint[0] * 0.55;
                            g = g * 0.45 + tint[1] * 0.55;
                            b = b * 0.45 + tint[2] * 0.55;
                        }
                    }
                    const o = o0 + x * 4;
                    D[o] = r * fog; D[o + 1] = g * fog; D[o + 2] = b * fog; D[o + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
        }

        const rdx = dx[(player.dir + 1) % 4];
        const rdy = dy[(player.dir + 1) % 4];

        // 怪物／祭壇：換算成相對玩家的 d（前方）、k（右方），依「所屬格子」分組
        //   移動中的怪物位置是小數；分組時歸到兩格中較靠近玩家視線的那一格（較晚畫）
        const now = performance.now(), T = now / 1000;
        const fdx = dx[player.dir], fdy = dy[player.dir];
        const toDK = (x, y) => [(x - player.x) * fdx + (y - player.y) * fdy, (x - player.x) * rdx + (y - player.y) * rdy];
        const buckets = new Map();
        const addItem = (cellD, cellK, item) => {
            const key = cellD + ',' + cellK;
            if (!buckets.has(key)) buckets.set(key, []);
            buckets.get(key).push(item);
        };
        if (window.M3D) {
            for (const al of altars) {
                const [d, k] = toDK(al.x, al.y);
                addItem(d, k, { model: 'altar', state: al.lit, d, k, seed: 0 });
            }
            for (const mo of monsters) {
                const p = Math.min(1, (now - mo.moveStart) / MONSTER_MOVE_MS);
                const e = (1 - Math.cos(Math.PI * p)) / 2;   // 慢 → 快 → 慢
                const [d, k] = toDK(mo.fromX + (mo.x - mo.fromX) * e, mo.fromY + (mo.y - mo.fromY) * e);
                let [cd, ck] = toDK(mo.x, mo.y);
                if (p < 1) {
                    const [fd, fk] = toDK(mo.fromX, mo.fromY);
                    if (fd < cd || (fd === cd && Math.abs(fk) < Math.abs(ck))) { cd = fd; ck = fk; }
                }
                addItem(cd, ck, { model: mo.type, state: undefined, d, k, seed: mo.seed });
            }
        }

        // d：前方第幾格；k：橫向偏移（右為正、左為負）；界外視為牆
        function isWall(d, k) {
            const tx = player.x + dx[player.dir] * d + rdx * k;
            const ty = player.y + dy[player.dir] * d + rdy * k;
            if (tx < 0 || tx >= mazeSize || ty < 0 || ty >= mazeSize) return true;
            return map[ty][tx] === 1;
        }

        function project(X, Y, Z) {
            return [cx + X * F / Z, cy - Y * F / Z];
        }

        const wallTex = TEX.wall[texChoice.wall].canvas;
        ctx.imageSmoothingEnabled = false; // 像素風

        // 以半透明黑色蓋上去，做出明暗與霧化（b = 亮度 0~1）
        function shade(x, y, ww, hh, b) {
            const a = 1 - b;
            if (a > 0.005) {
                ctx.fillStyle = `rgba(0,0,0,${a.toFixed(3)})`;
                ctx.fillRect(x, y, ww, hh);
            }
        }

        // 朝向玩家的正面：位於深度 Z，橫向 x0 ~ x1（畫面上是長方形，直接貼圖）
        function frontFace(x0, x1, Z) {
            const [sx0, top] = project(x0, 0.5, Z);
            const [sx1, bottom] = project(x1, -0.5, Z);
            ctx.drawImage(wallTex, sx0, top, sx1 - sx0, bottom - top);
            shade(sx0, top, sx1 - sx0, bottom - top, Math.max(0.08, 1 - Z / FOG_DIST));
        }

        // 側面：位於橫向 X，深度 z0 ~ z1（z0 可能被近裁切面截過）
        // 畫面上是梯形：切成 1px 寬直條，依該欄的實際深度取材質（透視正確）
        function sideFace(X, z0, z1) {
            const zEdge = z1 - 1; // 該格真正的前緣深度
            const a = cx + X * F / z0, b = cx + X * F / z1;
            const s0 = Math.max(0, Math.floor(Math.min(a, b)));
            const s1 = Math.min(w, Math.ceil(Math.max(a, b)));
            for (let sx = s0; sx < s1; sx++) {
                const z = X * F / (sx + 0.5 - cx);
                if (!(z >= z0 && z <= z1)) continue;
                const tc = Math.min(TEX_SIZE - 1, Math.max(0, ((z - zEdge) * TEX_SIZE) | 0));
                const top = cy - 0.5 * F / z, hh = F / z;
                ctx.drawImage(wallTex, tc, 0, 1, TEX_SIZE, sx, top, 1, hh);
                shade(sx, top, 1, hh, 0.65 * Math.max(0.08, 1 - z / FOG_DIST));
            }
        }

        // 由遠到近；同一深度由外側往中間，牆與怪物／祭壇交錯畫
        // （同一深度裡，較靠中間的牆會擋住較外側格子裡的東西，所以外側的東西要先畫）
        for (let d = MAX_DEPTH; d >= 0; d--) {
            const zFront = d - 0.5 + CAM_BACK;
            const zBack = d + 0.5 + CAM_BACK;

            for (let a = MAX_SIDE; a >= 0; a--) {
                const ks = (a === 0) ? [0] : [-a, a];
                for (const k of ks) {
                    if (!isWall(d, k)) {
                        const items = buckets.get(d + ',' + k);
                        if (items) for (const it of items) drawItem(it);
                        continue;
                    }

                    // 正面：前一格（較近的一格）是通道時才看得到
                    if (d >= 1 && !isWall(d - 1, k)) {
                        frontFace(k - 0.5, k + 0.5, zFront);
                    }
                    // 面向走道中線的側面：該側鄰格是通道時才看得到
                    // （這就是轉角／岔路口能看穿過去的關鍵）
                    if (k < 0 && !isWall(d, k + 1)) {
                        sideFace(k + 0.5, Math.max(zFront, NEAR), zBack);
                    } else if (k > 0 && !isWall(d, k - 1)) {
                        sideFace(k - 0.5, Math.max(zFront, NEAR), zBack);
                    }
                }
            }
        }

        // 怪物／祭壇的立體模型（d、k 可為小數：移動中的怪物）
        function drawItem(it) {
            if (it.d < 0.3) return;   // 太貼近鏡頭（玩家所在格）不畫
            const m = M3D.MODELS[it.model];
            const yaw = m.face === 'player' ? Math.sin(T * 0.8 + it.seed) * 0.3 : 0;
            const rY = M3D.rotY(yaw);
            const toCam = q => { const r = rY(q); return [it.k + r[0], -0.5 + r[1], it.d + r[2]]; };
            const proj = p => [cx + p[0] * F / p[2], cy - p[1] * F / p[2]];
            const fogFn = z => Math.max(0.1, 1 - z / FOG_DIST);
            if (m.sh) M3D.drawShadow(ctx, toCam, proj, m.sh, 0.45 * fogFn(it.d));
            M3D.drawFaces(ctx, m.build(T, it.state), toCam, proj, fogFn);
        }
    }

    // 更新 2D 小地圖（使用三角形指標代表玩家面向）
    function updateView() {
        render3DView();

        let minimapEl = document.getElementById('minimap');
        minimapEl.innerHTML = '';

        for (let dy_off = -3; dy_off <= 3; dy_off++) {
            for (let dx_off = -3; dx_off <= 3; dx_off++) {
                let cell = document.createElement('div');
                cell.className = 'map-cell';

                let mx = player.x + dx_off;
                let my = player.y + dy_off;

                if (dx_off === 0 && dy_off === 0) {
                    // 玩家格子：使用旋轉三角形指標
                    let arrow = document.createElement('div');
                    arrow.className = `player-arrow dir-${player.dir}`;
                    cell.appendChild(arrow);
                } else if (mx >= 0 && mx < mazeSize && my >= 0 && my < mazeSize) {
                    if (explored[my][mx]) {
                        const al = altarAt(mx, my);
                        if (mx === goalPos.x && my === goalPos.y) {
                            cell.className += ' goal';
                            cell.textContent = '終';
                        } else if (al) {
                            cell.className += al.lit ? ' altar lit' : ' altar';
                            cell.textContent = '祭';
                        } else if (map[my][mx] === 1) {
                            cell.className += ' wall';
                        } else {
                            cell.className += ' floor';
                        }
                    }
                }
                minimapEl.appendChild(cell);
            }
        }
    }

    function showModal(title, text, isQuit, isVictory = false) {
        modalType = isVictory ? 'victory' : 'quit';
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-text').textContent = text;
        
        let btnBox = document.getElementById('modal-buttons');
        if (isVictory) {
            btnBox.innerHTML = `<button class="retro-btn" onclick="closeModalToSummary()">查看復盤 (Enter / ESC)</button>`;
        } else if (isQuit) {
            btnBox.innerHTML = `
                <button class="retro-btn" onclick="confirmModal(true)">確定 (Enter)</button>
                <button class="retro-btn" onclick="confirmModal(false)">取消 (ESC)</button>
            `;
        }
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function confirmModal(isConfirm) {
        modalType = null;
        document.getElementById('modal-overlay').style.display = 'none';
        if (isConfirm) {
            showSummaryScreen();
        } else {
            isMoving = false;
        }
    }

    function closeModalToSummary() {
        modalType = null;
        document.getElementById('modal-overlay').style.display = 'none';
        showSummaryScreen();
    }

    function showSummaryScreen() {
        stopLoops();
        gameState = 'SUMMARY';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('controls-bar').style.display = 'none';
        
        let gridEl = document.getElementById('full-map-grid');
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `repeat(${mazeSize}, 14px)`;

        for (let y = 0; y < mazeSize; y++) {
            for (let x = 0; x < mazeSize; x++) {
                let cell = document.createElement('div');
                cell.className = 'full-cell';

                if (x === startPos.x && y === startPos.y) {
                    cell.className += ' start';
                } else if (x === goalPos.x && y === goalPos.y) {
                    cell.className += ' goal';
                } else if (altarAt(x, y)) {
                    cell.className += altarAt(x, y).lit ? ' altar lit' : ' altar';
                } else if (monsterAt(x, y)) {
                    cell.className += ' monster';
                } else if (trailMap[y][x]) {
                    cell.className += ' trail';
                } else if (map[y][x] === 1) {
                    cell.className += ' wall';
                } else {
                    cell.className += ' floor';
                }
                gridEl.appendChild(cell);
            }
        }

        document.getElementById('summary-screen').style.display = 'flex';
    }

    function selectMenu(i) {
        if (i !== menuIndex || !document.getElementById('sel-monsters').options.length) {
            menuIndex = i;
            refreshCountSelects();
        }
        document.querySelectorAll('.menu-btn').forEach((b, idx) => b.classList.toggle('selected', idx === menuIndex));
    }

    function openMapView() {
        if (gameState !== 'PLAYING' || modalType || isMoving) return;
        modalType = 'map';

        const gridEl = document.getElementById('view-map-grid');
        const cell = Math.max(6, Math.min(18, Math.floor((290 - mazeSize) / mazeSize)));
        gridEl.style.gridTemplateColumns = `repeat(${mazeSize}, ${cell}px)`;
        gridEl.style.gridAutoRows = `${cell}px`;
        gridEl.innerHTML = '';

        for (let y = 0; y < mazeSize; y++) {
            for (let x = 0; x < mazeSize; x++) {
                const c = document.createElement('div');
                c.className = 'view-cell';
                if (explored[y][x]) {
                    if (x === player.x && y === player.y) {
                        c.className += ' player';
                        c.style.fontSize = Math.max(6, cell - 2) + 'px';
                        c.textContent = ['▲', '▶', '▼', '◀'][player.dir];
                    } else if (x === goalPos.x && y === goalPos.y) c.className += ' goal';
                    else if (x === startPos.x && y === startPos.y) c.className += ' start';
                    else if (altarAt(x, y)) c.className += altarAt(x, y).lit ? ' altar lit' : ' altar';
                    else if (map[y][x] === 1) c.className += ' wall';
                    else if (trailMap[y][x]) c.className += ' trail';
                    else c.className += ' floor';
                }
                gridEl.appendChild(c);
            }
        }
        document.getElementById('map-overlay').style.display = 'flex';
    }

    function closeMapView() {
        modalType = null;
        document.getElementById('map-overlay').style.display = 'none';
    }

    function returnToMenu() {
        gameState = 'MENU';
        document.getElementById('summary-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'flex';
        document.getElementById('status-info').textContent = '請選擇大小';
        selectMenu(menuIndex);
    }

    // 材質選單：填入選項，並記住上次的選擇（瀏覽器不允許儲存時就用預設值）
    function initTextureSelects() {
        try {
            const saved = JSON.parse(localStorage.getItem('maze-textures') || 'null');
            if (saved) for (const cat in texChoice) {
                if (Number.isInteger(saved[cat]) && TEX[cat][saved[cat]]) texChoice[cat] = saved[cat];
            }
        } catch (e) { /* 忽略 */ }

        for (const cat in texChoice) {
            const sel = document.getElementById('sel-' + cat);
            TEX[cat].forEach((t, i) => sel.add(new Option(t.name, i)));
            sel.value = texChoice[cat];
            sel.addEventListener('change', () => {
                texChoice[cat] = +sel.value;
                sel.blur(); // 讓 ← → / Enter 回到選單尺寸操作
                try { localStorage.setItem('maze-textures', JSON.stringify(texChoice)); } catch (e) { /* 忽略 */ }
            });
        }
    }

    initTextureSelects();
    initCountSelects();
    initSpeedSelect();
    selectMenu(0);
</script>
</body>
</html>
