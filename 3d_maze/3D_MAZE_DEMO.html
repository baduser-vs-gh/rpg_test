<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古網格迷宮</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b132b;
            color: #f8fafc;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            /* min-height: 100vh; */
            padding: 12px;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 820px;
            background-color: #1c2541;
            border: 3px solid #475569;
            border-radius: 12px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.8);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-weight: bold;
            font-size: 16px;
            color: #38bdf8;
        }

        /* 主選單畫面 */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }
        #menu-screen h1 { color: #fbbf24; font-size: 24px; letter-spacing: 2px; }
        .btn-group { display: flex; gap: 15px; margin-top: 10px; }
        .retro-btn {
            background: #334155;
            color: #fff;
            border: 2px solid #64748b;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.1s;
        }
        .retro-btn:hover { background: #475569; border-color: #38bdf8; color: #38bdf8; }
        .retro-btn:active { transform: translateY(2px); }

        /* 遊戲主畫面容器 */
        #game-screen {
            display: none;
            position: relative;
            width: 100%;
            height: 440px;
            background: #000;
            border: 2px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }

        /* 3D 畫布視圖 */
        #mazeCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #030712;
        }

        /* 右上角 7x7 2D 小地圖 */
        #minimap {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #38bdf8;
            display: grid;
            grid-template-columns: repeat(7, 11px);
            grid-template-rows: repeat(7, 11px);
            gap: 1px;
            padding: 2px;
            border-radius: 4px;
            z-index: 10;
        }
        .map-cell {
            width: 11px;
            height: 11px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: bold;
            position: relative;
        }
        .map-cell.wall { background: #475569; }
        .map-cell.floor { background: #1e293b; }
        .map-cell.goal { background: #22c55e; color: #fff; }

        /* 玩家三角形指標 (CSS 繪製) */
        .player-arrow {
            width: 0;
            height: 0;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-bottom: 6px solid #e74c3c;
            position: absolute;
            transition: transform 0.1s;
        }
        /* 旋轉方向對應 */
        .dir-0 { transform: rotate(0deg); }   /* 北 */
        .dir-1 { transform: rotate(90deg); }  /* 東 */
        .dir-2 { transform: rotate(180deg); } /* 南 */
        .dir-3 { transform: rotate(270deg); } /* 西 */

        /* 畫面下方控制按鈕列 */
        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            background-color: #0d1527;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .ctrl-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #64748b;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.1s;
        }
        .ctrl-btn:hover { background: #334155; border-color: #38bdf8; color: #38bdf8; }
        .ctrl-btn:active { transform: translateY(2px); }
        .ctrl-btn.quit { border-color: #dc2626; color: #fca5a5; }
        .ctrl-btn.quit:hover { background: #7f1d1d; color: #fff; }

        /* 選單鍵盤選取 */
        .retro-btn.selected { background: #475569; border-color: #38bdf8; color: #38bdf8; }
        .side-btns { display: flex; flex-direction: column; gap: 8px; }

        /* 選單：材質選擇 */
        .theme-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: #94a3b8; }
        .theme-row label { display: flex; align-items: center; gap: 6px; }
        .theme-row select {
            background: #1e293b; color: #f8fafc; border: 2px solid #64748b; border-radius: 6px;
            padding: 4px 6px; font-family: monospace; font-size: 13px; cursor: pointer;
        }
        .theme-row select:hover { border-color: #38bdf8; }

        /* 畫面上方提示訊息 */
        #toast {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; color: #e0f2fe;
            padding: 6px 16px; border-radius: 8px; font-size: 15px; font-weight: bold;
            z-index: 20; pointer-events: none; white-space: nowrap;
            opacity: 0; transition: opacity 0.25s;
        }
        #toast.show { opacity: 1; }
        #toast.danger { border-color: #ef4444; color: #fecaca; }
        #toast.ok { border-color: #facc15; color: #fef08a; }

        /* 祭壇／怪物在地圖上的顯示 */
        .map-cell.altar { background: #78716c; color: #f5f5f4; }
        .map-cell.altar.lit { background: #facc15; color: #422006; }
        .view-cell.altar { background: #a8a29e; }
        .view-cell.altar.lit { background: #facc15; }
        .full-cell.altar { background: #a8a29e; }
        .full-cell.altar.lit { background: #facc15; }
        .full-cell.monster { background: #ef4444; }

        /* 已走過地圖檢視 */
        #view-map-grid {
            display: grid;
            gap: 1px;
            background: #0f172a;
            border: 2px solid #64748b;
            padding: 4px;
            border-radius: 6px;
            justify-self: center;
        }
        .view-cell {
            background: #0f172a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            overflow: hidden;
        }
        .view-cell.wall { background: #475569; }
        .view-cell.floor { background: #1e293b; }
        .view-cell.trail { background: #0ea5e9; }
        .view-cell.start { background: #fbbf24; }
        .view-cell.goal { background: #22c55e; }
        .view-cell.player { background: #e74c3c; }

        /* 十字方向鍵 */
        .controls-bar { align-items: center; gap: 24px; }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 96px);
            grid-template-rows: repeat(3, 40px);
            gap: 6px;
        }
        .dpad .ctrl-btn { justify-content: center; padding: 0; }
        .pad-up    { grid-column: 2; grid-row: 1; }
        .pad-left  { grid-column: 1; grid-row: 2; }
        .pad-right { grid-column: 3; grid-row: 2; }
        .pad-down  { grid-column: 2; grid-row: 3; }

        /* 彈窗畫面 */
        .modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(11, 19, 43, 0.92);
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 8px;
        }
        .modal-card {
            background: #1c2541;
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            width: 90%;
        }
        .modal-card h3 { color: #fbbf24; font-size: 18px; }

        /* 最終 2D 全景復盤畫面 */
        #summary-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 10px;
        }
        #full-map-grid {
            display: grid;
            gap: 1px;
            background: #334155;
            border: 2px solid #64748b;
            padding: 4px;
            max-height: 320px;
            overflow: auto;
            border-radius: 6px;
        }
        .full-cell {
            width: 14px;
            height: 14px;
            background: #0f172a;
        }
        .full-cell.wall { background: #475569; }
        .full-cell.floor { background: #1e293b; }
        .full-cell.trail { background: #0ea5e9; }
        .full-cell.start { background: #fbbf24; }
        .full-cell.goal { background: #22c55e; }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <div class="title">復古網格迷宮</div>
        <div style="font-size: 13px; color: #94a3b8;" id="status-info">請選擇大小</div>
    </header>

    <!-- 主選單 -->
    <div id="menu-screen">
        <h1>迷宮探險選單</h1>
        <p style="color: #94a3b8; font-size: 14px;">請選擇迷宮尺寸大小：</p>
        <div class="btn-group">
            <button class="retro-btn menu-btn" onmouseenter="selectMenu(0)" onclick="startGame(10)">10 x 10</button>
            <button class="retro-btn menu-btn" onmouseenter="selectMenu(1)" onclick="startGame(20)">20 x 20</button>
            <button class="retro-btn menu-btn" onmouseenter="selectMenu(2)" onclick="startGame(30)">30 x 30</button>
        </div>
        <p style="color: #64748b; font-size: 12px;">← → 選擇，Enter 確認</p>
        <div class="theme-row" style="margin-top: 6px;">
            <label>怪物數量 <select id="sel-monsters"></select></label>
            <label>祭壇數量 <select id="sel-altars"></select></label>
            <label>怪物移動間隔 <select id="sel-speed">
                <option value="1">1 秒</option>
                <option value="2">2 秒</option>
                <option value="3">3 秒</option>
                <option value="4">4 秒</option>
                <option value="5">5 秒</option>
            </select></label>
        </div>
        <p style="color: #64748b; font-size: 12px;">點亮所有祭壇後，才能從出口離開迷宮</p>
        <p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">迷宮材質：</p>
        <div class="theme-row">
            <label>牆壁 <select id="sel-wall"></select></label>
            <label>地板 <select id="sel-floor"></select></label>
            <label>天花板 <select id="sel-ceil"></select></label>
        </div>
    </div>

    <!-- 遊戲主畫面 -->
    <div id="game-screen">
        <canvas id="mazeCanvas" width="768" height="440"></canvas>
        <div id="minimap"></div>
        <div id="toast"></div>

        <div id="map-overlay" class="modal-overlay">
            <div class="modal-card" style="max-width: none; width: auto; padding: 12px; gap: 8px;">
                <h3>已走過的地圖</h3>
                <div id="view-map-grid"></div>
                <button class="retro-btn" onclick="closeMapView()">關閉 (Space / ESC)</button>
            </div>
        </div>

        <div id="modal-overlay" class="modal-overlay">
            <div class="modal-card">
                <h3 id="modal-title">提示訊息</h3>
                <p id="modal-text" style="font-size: 14px; color: #cbd5e1;">是否離開遊戲？</p>
                <div class="btn-group" id="modal-buttons" style="justify-content: center;">
                    <button class="retro-btn" onclick="confirmModal(true)">確定</button>
                    <button class="retro-btn" onclick="confirmModal(false)">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 最終復盤畫面 -->
    <div id="summary-screen">
        <h2 style="color: #fbbf24; font-size: 18px;">迷宮探索復盤</h2>
        <p style="font-size: 13px; color: #94a3b8;">藍色：本局走過的路徑　黃色：已點亮祭壇　灰色：未點亮祭壇　紅色：怪物最後位置</p>
        <div id="full-map-grid"></div>
        <p style="font-size: 13px; color: #38bdf8;">按下 [Enter] / [ESC] 鍵或點擊下方按鈕返回主選單</p>
        <button class="retro-btn" onclick="returnToMenu()">返回主選單</button>
    </div>

    <!-- 控制按鈕列 -->
    <div class="controls-bar" id="controls-bar" style="display: none;">
        <div class="dpad">
            <button class="ctrl-btn pad-up" onclick="handleAction('FORWARD')"><span>⬆</span> 前進</button>
            <button class="ctrl-btn pad-left" onclick="handleAction('LEFT')"><span>⬅</span> 左轉</button>
            <button class="ctrl-btn pad-right" onclick="handleAction('RIGHT')"><span>➡</span> 右轉</button>
            <button class="ctrl-btn pad-down" onclick="handleAction('BACKWARD')"><span>⬇</span> 後退</button>
        </div>
        <div class="side-btns">
            <button class="ctrl-btn" onclick="openMapView()"><span>🗺</span> 地圖 (Space)</button>
            <button class="ctrl-btn quit" onclick="handleAction('QUIT')"><span>❌</span> 放棄 (ESC)</button>
        </div>
    </div>
</div>

<!-- 3D 模型（單檔測試版：已把 models 資料夾的檔案內嵌進來） -->
<script>
/* ===== 內嵌自 models/engine3d.js ===== */
// =====================================================================
// 迷你 3D 引擎：用多邊形拼模型，以畫家演算法畫在 Canvas 2D 上
//   模型座標：1 = 一格；y = 0 為地板；模型正面朝 -z
//   以一般 <script src> 載入（不是 ES module），雙擊 HTML 用 file:// 開也能用
//   提供全域物件 M3D；模型檔把模型登記到 M3D.MODELS
// =====================================================================
(function () {
    const TAU = Math.PI * 2;
    const hex = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
    const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const len = a => Math.hypot(a[0], a[1], a[2]);
    const norm = a => mul(a, 1 / (len(a) || 1));

    // 繞軸旋轉（p 為支點），回傳變換函式
    const rotX = (a, p = [0, 0, 0]) => { const c = Math.cos(a), s = Math.sin(a); return q => { const y = q[1] - p[1], z = q[2] - p[2]; return [q[0], p[1] + y * c - z * s, p[2] + y * s + z * c]; }; };
    const rotY = (a, p = [0, 0, 0]) => { const c = Math.cos(a), s = Math.sin(a); return q => { const x = q[0] - p[0], z = q[2] - p[2]; return [p[0] + x * c + z * s, q[1], p[2] - x * s + z * c]; }; };
    const rotZ = (a, p = [0, 0, 0]) => { const c = Math.cos(a), s = Math.sin(a); return q => { const x = q[0] - p[0], y = q[1] - p[1]; return [p[0] + x * c - y * s, p[1] + x * s + y * c, q[2]]; }; };

    // 一個面：頂點、顏色、所屬零件中心（用來判斷法向量朝外）
    //   o.two 雙面、o.alpha 透明度、o.glow 自體發光（不受光影影響）
    function face(pts, col, center, o = {}) {
        return { pts, col: typeof col === 'string' ? hex(col) : col, center,
                 two: !!o.two, alpha: o.alpha || 1, glow: !!o.glow };
    }
    // 對 start 之後加入的面套用變換（用來做關節旋轉）
    function xform(M, start, fn) {
        for (let i = start; i < M.length; i++) { M[i].pts = M[i].pts.map(fn); M[i].center = fn(M[i].center); }
    }
    // 方塊：[x, 底部 y, z]、[寬, 高, 深]
    function box(M, [x, y, z], [w, h, d], col, o) {
        const x0 = x - w / 2, x1 = x + w / 2, y1 = y + h, z0 = z - d / 2, z1 = z + d / 2;
        const P = [[x0, y, z0], [x1, y, z0], [x1, y1, z0], [x0, y1, z0], [x0, y, z1], [x1, y, z1], [x1, y1, z1], [x0, y1, z1]];
        const ctr = [x, y + h / 2, z];
        for (const f of [[0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7], [1, 5, 6, 2], [3, 2, 6, 7], [4, 5, 1, 0]])
            M.push(face(f.map(i => P[i]), col, ctr, o));
    }
    // 兩點之間的方柱（骨頭、腳、劍）
    function beam(M, a, b, t, col, o) {
        const d = norm(sub(b, a));
        const u = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const e1 = mul(norm(cross(d, u)), t / 2), e2 = mul(norm(cross(d, e1)), t / 2);
        const ring = p => [add(add(p, e1), e2), sub(add(p, e1), e2), sub(sub(p, e1), e2), add(sub(p, e1), e2)];
        const A = ring(a), B = ring(b), ctr = mul(add(a, b), 0.5);
        for (let i = 0; i < 4; i++) M.push(face([A[i], A[(i + 1) % 4], B[(i + 1) % 4], B[i]], col, ctr, o));
        M.push(face(A, col, ctr, o)); M.push(face(B, col, ctr, o));
    }
    // 球體／橢球（o.half: 只要上半球；o.capCol: 半球底面顏色）
    function sphere(M, [cx, cy, cz], [rx, ry, rz], col, o = {}) {
        const seg = o.seg || 10, rings = o.rings || 6, top = o.half ? rings / 2 : rings;
        const pt = (i, j) => { const th = j / rings * Math.PI, ph = i / seg * TAU;
            return [cx + rx * Math.sin(th) * Math.cos(ph), cy + ry * Math.cos(th), cz + rz * Math.sin(th) * Math.sin(ph)]; };
        for (let j = 0; j < top; j++) for (let i = 0; i < seg; i++) {
            const q = [pt(i, j), pt(i + 1, j), pt(i + 1, j + 1), pt(i, j + 1)];
            M.push(face(j === 0 ? [q[0], q[2], q[3]] : q, col, [cx, cy, cz], o));
        }
        if (o.half && !o.noCap) {
            const ring = []; for (let i = 0; i < seg; i++) ring.push(pt(i, top));
            M.push(face(ring, o.capCol || col, [cx, cy + ry * 0.3, cz], o));
        }
    }
    // 圓柱／圓錐（r1 = 0 為圓錐；h 為負時尖端朝下）
    function frustum(M, [cx, cy, cz], r0, r1, h, col, o = {}) {
        const seg = o.seg || 8, ctr = [cx, cy + h / 2, cz];
        const b = i => { const a = i / seg * TAU; return [cx + Math.cos(a) * r0, cy, cz + Math.sin(a) * r0]; };
        const t = i => { const a = i / seg * TAU; return [cx + Math.cos(a) * r1, cy + h, cz + Math.sin(a) * r1]; };
        for (let i = 0; i < seg; i++)
            M.push(face(r1 > 1e-4 ? [b(i), b(i + 1), t(i + 1), t(i)] : [b(i), b(i + 1), t(i)], col, ctr, o));
        if (!o.noCap) {
            if (r0 > 1e-4) M.push(face([...Array(seg)].map((_, i) => b(i)), col, ctr, o));
            if (r1 > 1e-4) M.push(face([...Array(seg)].map((_, i) => t(i)), col, ctr, o));
        }
    }

    // 光源：從玩家後上方照過來（相機座標）
    const LIGHT = norm([-0.35, 0.75, -0.55]);

    // 畫出模型
    //   toCam(p)  模型座標 → 相機座標 [X 右, Y 上, Z 前]
    //   proj(p)   相機座標 → 螢幕座標 [sx, sy]
    //   fogFn(z)  距離 → 亮度 (0~1)
    function drawFaces(ctx, M, toCam, proj, fogFn) {
        const list = [];
        for (const f of M) {
            const P = f.pts.map(toCam);
            if (P.some(p => p[2] < 0.05)) continue;
            const cen = [0, 0, 0];
            for (const p of P) { cen[0] += p[0]; cen[1] += p[1]; cen[2] += p[2]; }
            cen[0] /= P.length; cen[1] /= P.length; cen[2] /= P.length;
            let n = [0, 0, 0]; // Newell 法向量
            for (let i = 0; i < P.length; i++) {
                const a = P[i], b = P[(i + 1) % P.length];
                n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]);
            }
            const nl = len(n); if (nl < 1e-12) continue;
            n = mul(n, 1 / nl);
            if (dot(n, sub(cen, toCam(f.center))) < 0) n = mul(n, -1);
            const facing = dot(n, cen);
            if (!f.two && facing >= 0) continue;   // 背面不畫
            if (f.two && facing > 0) n = mul(n, -1);
            const light = f.glow ? 1 : 0.32 + 0.68 * Math.max(0, dot(n, LIGHT));
            list.push({ P, z: len(cen), f, light });
        }
        list.sort((a, b) => b.z - a.z);
        for (const it of list) {
            const f = it.f, fog = fogFn(it.z);
            const k = f.glow ? Math.sqrt(fog) : it.light * fog;
            const r = Math.min(255, f.col[0] * k) | 0, g = Math.min(255, f.col[1] * k) | 0, b = Math.min(255, f.col[2] * k) | 0;
            ctx.fillStyle = f.alpha < 1 ? `rgba(${r},${g},${b},${f.alpha.toFixed(2)})` : `rgb(${r},${g},${b})`;
            ctx.beginPath();
            it.P.forEach((p, i) => { const [sx, sy] = proj(p); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
            ctx.closePath(); ctx.fill();
            if (f.alpha >= 1) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6; ctx.stroke(); } // 蓋掉面與面之間的細縫
        }
    }
    // 地上的圓形影子
    function drawShadow(ctx, toCam, proj, r, alpha) {
        const pts = [];
        for (let i = 0; i < 16; i++) {
            const a = i / 16 * TAU, p = toCam([Math.cos(a) * r, 0.004, Math.sin(a) * r]);
            if (p[2] < 0.05) return;
            pts.push(proj(p));
        }
        ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
        ctx.beginPath();
        pts.forEach(([sx, sy], i) => i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy));
        ctx.closePath(); ctx.fill();
    }

    window.M3D = {
        TAU, hex, add, sub, mul, dot, cross, len, norm,
        rotX, rotY, rotZ, face, xform, box, beam, sphere, frustum,
        drawFaces, drawShadow,
        // 模型登記處：{ id: { name, cat, build(t, state), face, sh } }
        //   cat：monster 怪物 / altar 祭壇 / item 寶物 / trap 機關
        //   face：player 面向玩家 / world 固定朝向 / spin 原地旋轉
        //   sh：影子半徑（0 = 不畫）
        MODELS: {},
    };
})();

<script>
/* ===== 內嵌自 models/monsters.js ===== */
// =====================================================================
// 怪物模型（10 種）— 需先載入 engine3d.js
//   每個 build(t) 回傳面清單；t = 秒，用來做動作
// =====================================================================
(function () {
    const { TAU, box, beam, sphere, frustum, face, xform, rotX, rotZ } = M3D;

    function buildSlime(t) {
        const M = [], s = Math.sin(t * 4), ry = 0.2 * (1 + 0.15 * s), rxz = 0.28 * (1 - 0.07 * s);
        sphere(M, [0, ry, 0], [rxz, ry, rxz], '#45c043', { seg: 12, rings: 8 });
        for (const sx of [-1, 1]) sphere(M, [sx * 0.085, ry * 1.3, -rxz * 0.93], [0.035, 0.05, 0.025], '#0d1a0d', { seg: 6, rings: 4 });
        sphere(M, [-0.11, ry * 1.65, -rxz * 0.47], [0.05, 0.025, 0.04], '#eaffea', { seg: 6, rings: 4, glow: true });
        return M;
    }

    function buildSkeleton(t) {
        const M = [], B = '#e6dfcc';
        beam(M, [-0.06, 0, 0], [-0.06, 0.32, 0], 0.045, B);
        beam(M, [0.06, 0, 0], [0.06, 0.32, 0], 0.045, B);
        box(M, [0, 0.3, 0], [0.2, 0.06, 0.09], B);
        beam(M, [0, 0.34, 0], [0, 0.62, 0], 0.04, B);
        for (let i = 0; i < 4; i++) box(M, [0, 0.4 + i * 0.05, -0.01], [0.22 - i * 0.025, 0.022, 0.13], B);
        box(M, [0, 0.6, 0], [0.28, 0.035, 0.06], B);
        beam(M, [-0.14, 0.6, 0], [-0.16, 0.4, -0.02], 0.035, B);
        const st = M.length, sw = 0.45 + 0.6 * Math.sin(t * 3);   // 揮劍
        beam(M, [0.14, 0.6, 0], [0.15, 0.4, 0], 0.035, B);
        box(M, [0.15, 0.36, 0], [0.025, 0.06, 0.025], '#6b4a1f');
        box(M, [0.15, 0.42, 0], [0.1, 0.02, 0.035], '#c9a227');
        box(M, [0.15, 0.44, 0], [0.03, 0.34, 0.012], '#c3ccd5');
        xform(M, st, rotX(sw, [0.14, 0.6, 0]));
        sphere(M, [0, 0.72, 0], [0.085, 0.085, 0.09], B, { seg: 10, rings: 7 });
        box(M, [0, 0.62, -0.02], [0.1, 0.045, 0.08], B);
        for (const sx of [-1, 1]) {
            sphere(M, [sx * 0.033, 0.73, -0.08], [0.022, 0.026, 0.012], '#111111', { seg: 6, rings: 4 });
            sphere(M, [sx * 0.033, 0.73, -0.09], [0.008, 0.008, 0.006], '#ff3b3b', { seg: 5, rings: 3, glow: true });
        }
        return M;
    }

    function buildBat(t) {
        const M = [], y = 0.42 + 0.03 * Math.sin(t * 3), C = '#4a2c58';
        sphere(M, [0, y, 0], [0.07, 0.09, 0.065], C, { seg: 8, rings: 6 });
        sphere(M, [0, y + 0.11, -0.01], [0.055, 0.05, 0.05], C, { seg: 8, rings: 6 });
        for (const s of [-1, 1]) {
            frustum(M, [s * 0.03, y + 0.14, -0.01], 0.02, 0, 0.06, C, { seg: 5 });
            sphere(M, [s * 0.022, y + 0.12, -0.054], [0.012, 0.012, 0.008], '#ff4040', { seg: 5, rings: 3, glow: true });
            const st = M.length;
            const w = [[0.05, 0.05], [0.3, 0.14], [0.42, 0.04], [0.34, 0], [0.28, -0.04], [0.2, 0], [0.13, -0.05], [0.06, -0.03]]
                .map(([x, yy]) => [s * x, y + yy, 0.01]);
            M.push(face(w, '#3b2346', [s * 0.2, y, 0.01], { two: true }));
            xform(M, st, rotZ(s * Math.sin(t * 12) * 0.8, [s * 0.05, y + 0.02, 0]));   // 拍翅膀
        }
        return M;
    }

    function buildGhost(t) {
        const M = [], y = 0.08 + 0.03 * Math.sin(t * 2), W = '#e8eeff', A = 0.82;
        frustum(M, [0, y, 0], 0.2, 0.16, 0.3, W, { seg: 12, alpha: A, noCap: true });
        sphere(M, [0, y + 0.3, 0], [0.16, 0.16, 0.16], W, { seg: 12, rings: 8, half: true, noCap: true, alpha: A });
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + t; frustum(M, [Math.cos(a) * 0.15, y + 0.005, Math.sin(a) * 0.15], 0.05, 0, -0.07, W, { seg: 5, alpha: A }); }
        for (const s of [-1, 1]) {
            sphere(M, [s * 0.06, y + 0.36, -0.14], [0.03, 0.045, 0.02], '#1b1f3a', { seg: 6, rings: 4 });
            sphere(M, [s * 0.22, y + 0.2 + 0.03 * Math.sin(t * 3 + s), 0], [0.05, 0.04, 0.04], W, { seg: 6, rings: 4, alpha: A });
        }
        sphere(M, [0, y + 0.25, -0.17], [0.03, 0.04, 0.015], '#1b1f3a', { seg: 6, rings: 4 });
        return M;
    }

    function buildEyeball(t) {
        const M = [], y = 0.4 + 0.03 * Math.sin(t * 2);
        for (let i = 0; i < 5; i++) {
            const a = i / 5 * TAU + 0.3; let p = [Math.cos(a) * 0.1, y - 0.14, Math.sin(a) * 0.1];
            for (let j = 1; j <= 4; j++) {
                const q = [Math.cos(a) * (0.1 + j * 0.02) + Math.sin(t * 3 + i + j) * 0.025, y - 0.14 - j * 0.06, Math.sin(a) * (0.1 + j * 0.02)];
                beam(M, p, q, 0.035 - j * 0.005, '#7a3d8f'); p = q;
            }
        }
        sphere(M, [0, y, 0], [0.2, 0.2, 0.2], '#f2ece6', { seg: 12, rings: 8 });
        const lx = Math.sin(t * 1.3) * 0.06, ly = Math.cos(t * 1.7) * 0.03;   // 眼珠轉動
        sphere(M, [lx, y + ly, -0.19], [0.08, 0.08, 0.03], '#2e86c1', { seg: 10, rings: 6 });
        sphere(M, [lx * 1.05, y + ly, -0.215], [0.04, 0.04, 0.012], '#050505', { seg: 8, rings: 4 });
        sphere(M, [lx - 0.02, y + ly + 0.02, -0.225], [0.012, 0.012, 0.006], '#ffffff', { seg: 5, rings: 3, glow: true });
        return M;
    }

    function buildMushroom(t) {
        const M = [], b = Math.abs(Math.sin(t * 4)) * 0.03;
        for (const s of [-1, 1]) sphere(M, [s * 0.07, 0.03, -0.02 + s * Math.sin(t * 8) * 0.02], [0.05, 0.03, 0.06], '#c8b28a', { seg: 6, rings: 4 });
        frustum(M, [0, 0.04 + b, 0], 0.12, 0.1, 0.28, '#efe2c4', { seg: 10 });
        for (const s of [-1, 1]) sphere(M, [s * 0.04, 0.2 + b, -0.112], [0.016, 0.024, 0.01], '#222222', { seg: 6, rings: 4 });
        sphere(M, [0, 0.3 + b, 0], [0.28, 0.2, 0.28], '#d8322a', { seg: 12, rings: 8, half: true, capCol: '#e9d7b0' });
        for (const [th, ph, r] of [[0.35, 1.9, 0.045], [0.8, 4.4, 0.04], [0.9, 1.0, 0.035], [0.65, 3.2, 0.03], [0.95, 5.6, 0.04], [0.2, 0.2, 0.03], [0.75, 2.4, 0.035]]) {
            sphere(M, [0.28 * Math.sin(th) * Math.cos(ph), 0.3 + b + 0.2 * Math.cos(th), 0.28 * Math.sin(th) * Math.sin(ph)], [r, r * 0.6, r], '#ffffff', { seg: 6, rings: 4 });
        }
        return M;
    }

    function buildGolem(t) {
        const M = [], S = '#7d7f86', D = '#6a6c73', step = Math.sin(t * 2.5);
        box(M, [-0.1, 0, 0], [0.12, 0.26, 0.13], D); box(M, [0.1, 0, 0], [0.12, 0.26, 0.13], D);
        box(M, [0, 0.25, 0], [0.42, 0.32, 0.25], S);
        box(M, [0, 0.57, -0.02], [0.18, 0.15, 0.16], '#878991');
        for (const s of [-1, 1]) {
            const st = M.length;
            box(M, [s * 0.28, 0.3, 0], [0.11, 0.28, 0.12], D);
            box(M, [s * 0.29, 0.2, 0], [0.15, 0.11, 0.15], '#5f6168');
            xform(M, st, rotX(s * step * 0.35 - 0.1, [s * 0.28, 0.55, 0]));
        }
        for (const s of [-1, 1]) box(M, [s * 0.045, 0.62, -0.105], [0.035, 0.022, 0.01], '#99ffff', { glow: true });
        const p = 0.5 + 0.5 * Math.sin(t * 4);
        box(M, [0, 0.4, -0.13], [0.07, 0.07, 0.01], [80 + 100 * p, 200 + 55 * p, 220 + 35 * p], { glow: true });
        return M;
    }

    function buildSpider(t) {
        const M = [];
        for (const s of [-1, 1]) for (let i = 0; i < 4; i++) {
            const up = Math.max(0, Math.sin(t * 8 + i * Math.PI / 2 + (s > 0 ? Math.PI : 0))) * 0.05;
            const hip = [s * 0.07, 0.17, -0.15 + i * 0.07], knee = [s * 0.22, 0.3 + up, -0.2 + i * 0.11], foot = [s * 0.34, up * 0.6, -0.3 + i * 0.18];
            beam(M, hip, knee, 0.028, '#262626'); beam(M, knee, foot, 0.022, '#262626');
        }
        sphere(M, [0, 0.2, 0.12], [0.17, 0.13, 0.2], '#2b2b2b', { seg: 10, rings: 7 });
        sphere(M, [0, 0.325, 0.12], [0.05, 0.012, 0.08], '#b91c1c', { seg: 8, rings: 4 });
        sphere(M, [0, 0.17, -0.12], [0.09, 0.08, 0.09], '#353535', { seg: 8, rings: 6 });
        for (const [x, y, r] of [[-0.03, 0.2, 0.018], [0.03, 0.2, 0.018], [-0.012, 0.225, 0.011], [0.012, 0.225, 0.011]])
            sphere(M, [x, y, -0.205], [r, r, r * 0.6], '#ff3030', { seg: 5, rings: 3, glow: true });
        beam(M, [-0.025, 0.13, -0.19], [-0.03, 0.08, -0.21], 0.014, '#dddddd');
        beam(M, [0.025, 0.13, -0.19], [0.03, 0.08, -0.21], 0.014, '#dddddd');
        return M;
    }

    // 火焰精靈：一團會跳動的火焰
    function buildFlame(t) {
        const M = [], y = 0.1 + 0.03 * Math.sin(t * 3);
        for (let i = 0; i < 7; i++) {
            const a = i / 7 * TAU + 0.4, h = 0.26 + 0.09 * Math.sin(t * 9 + i * 1.7);
            frustum(M, [Math.cos(a) * 0.09, y + 0.04, Math.sin(a) * 0.09], 0.07, 0, h, '#ff6a14', { seg: 5, glow: true });
        }
        for (let i = 0; i < 4; i++) {
            const a = i / 4 * TAU + t, h = 0.3 + 0.08 * Math.sin(t * 11 + i * 2.3);
            frustum(M, [Math.cos(a) * 0.04, y + 0.08, Math.sin(a) * 0.04], 0.05, 0, h, '#ffd23f', { seg: 5, glow: true });
        }
        sphere(M, [0, y + 0.12, 0], [0.12, 0.11, 0.12], '#ff8c1a', { seg: 10, rings: 6, glow: true });
        for (const s of [-1, 1]) sphere(M, [s * 0.045, y + 0.16, -0.11], [0.022, 0.03, 0.012], '#3a0a00', { seg: 6, rings: 4 });
        for (let i = 0; i < 5; i++) {   // 往上飄的火星
            const k = (t * 0.6 + i / 5) % 1, a = i * 2.1 + t * 0.5;
            box(M, [Math.cos(a) * 0.12, y + 0.25 + k * 0.35, Math.sin(a) * 0.12], [0.02, 0.02, 0.02], '#ffcf6b', { glow: true, alpha: Math.max(0.05, 1 - k) });
        }
        return M;
    }

    // 毒蛇：盤起身體，抬頭吐信
    function buildSnake(t) {
        const M = [], G1 = '#3f8f3a', G2 = '#2f6e2c';
        let last = null;
        for (let i = 0; i < 16; i++) {   // 盤繞的身體
            const a = i * 0.75, r = 0.18 - i * 0.006;
            const p = [Math.cos(a) * r, 0.05 + i * 0.012, Math.sin(a) * r + 0.04];
            sphere(M, p, [0.062 - i * 0.0012, 0.05, 0.062 - i * 0.0012], i % 2 ? G1 : G2, { seg: 7, rings: 5 });
            last = p;
        }
        const sway = Math.sin(t * 2) * 0.04;
        const head = [sway, 0.46, -0.1];
        for (let j = 1; j <= 5; j++) {   // 抬起的脖子
            const k = j / 6;
            const p = [last[0] + (head[0] - last[0]) * k, last[1] + (head[1] - last[1]) * Math.sin(k * Math.PI / 2), last[2] + (head[2] - last[2]) * k];
            sphere(M, p, [0.045, 0.045, 0.045], j % 2 ? G1 : G2, { seg: 7, rings: 5 });
        }
        sphere(M, head, [0.065, 0.045, 0.085], '#4aa043', { seg: 8, rings: 6 });
        for (const s of [-1, 1]) sphere(M, [head[0] + s * 0.038, head[1] + 0.02, head[2] - 0.045], [0.014, 0.014, 0.01], '#ffe14d', { seg: 5, rings: 3, glow: true });
        if (Math.sin(t * 5) > 0.2) {   // 吐信
            const tip = [head[0], head[1] - 0.01, head[2] - 0.17];
            beam(M, [head[0], head[1] - 0.01, head[2] - 0.08], tip, 0.01, '#e11d48', { glow: true });
            beam(M, tip, [tip[0] - 0.02, tip[1], tip[2] - 0.03], 0.008, '#e11d48', { glow: true });
            beam(M, tip, [tip[0] + 0.02, tip[1], tip[2] - 0.03], 0.008, '#e11d48', { glow: true });
        }
        return M;
    }

    Object.assign(M3D.MODELS, {
        slime:    { name: '史萊姆',   cat: 'monster', build: buildSlime,    face: 'player', sh: 0.28 },
        skeleton: { name: '骷髏兵',   cat: 'monster', build: buildSkeleton, face: 'player', sh: 0.2 },
        bat:      { name: '蝙蝠',     cat: 'monster', build: buildBat,      face: 'player', sh: 0.12 },
        ghost:    { name: '幽靈',     cat: 'monster', build: buildGhost,    face: 'player', sh: 0.18 },
        eyeball:  { name: '獨眼怪',   cat: 'monster', build: buildEyeball,  face: 'player', sh: 0.15 },
        mushroom: { name: '蘑菇怪',   cat: 'monster', build: buildMushroom, face: 'player', sh: 0.26 },
        golem:    { name: '石像魔像', cat: 'monster', build: buildGolem,    face: 'player', sh: 0.3 },
        spider:   { name: '巨型蜘蛛', cat: 'monster', build: buildSpider,   face: 'player', sh: 0.3 },
        flame:    { name: '火焰精靈', cat: 'monster', build: buildFlame,    face: 'player', sh: 0.15 },
        snake:    { name: '毒蛇',     cat: 'monster', build: buildSnake,    face: 'player', sh: 0.24 },
    });
})();

<script>
/* ===== 內嵌自 models/props.js ===== */
// =====================================================================
// 祭壇、寶物、機關模型 — 需先載入 engine3d.js
//   祭壇 build(t, lit)：lit = true 為發光狀態
//   寶物與機關目前遊戲還沒用到，先放著備用（預覽頁看得到）
// =====================================================================
(function () {
    const { TAU, box, beam, sphere, frustum, xform, rotX, rotY } = M3D;

    // ---------- 祭壇 ----------
    function buildAltar(t, lit) {
        const M = [], S = '#b3a68a', D = '#8f8269';   // 砂岩色，和灰色石牆區隔
        box(M, [0, 0, 0], [0.5, 0.06, 0.5], D);
        box(M, [0, 0.06, 0], [0.4, 0.05, 0.4], S);
        frustum(M, [0, 0.11, 0], 0.11, 0.09, 0.24, S, { seg: 8 });
        box(M, [0, 0.35, 0], [0.3, 0.05, 0.3], D);
        // 台座四面的符文：點亮時發光
        const rune = lit ? '#ffd35a' : '#4a4234';
        for (let i = 0; i < 4; i++) {
            const st = M.length;
            box(M, [0, 0.07, -0.203], [0.14, 0.025, 0.006], rune, { glow: lit });
            box(M, [0, 0.365, -0.153], [0.12, 0.02, 0.006], rune, { glow: lit });
            xform(M, st, rotY(i * Math.PI / 2));
        }
        // 頂端水晶（上下兩個角錐）
        const cy = 0.5 + (lit ? 0.03 * Math.sin(t * 2) : 0);
        const st = M.length, col = lit ? '#8ff6ff' : '#5a5a78';
        frustum(M, [0, cy, 0], 0.075, 0, 0.13, col, { seg: 4 });
        frustum(M, [0, cy, 0], 0.075, 0, -0.1, col, { seg: 4 });
        xform(M, st, rotY(lit ? t * 1.2 : 0.4));
        if (lit) {
            frustum(M, [0, 0.4, 0], 0.17, 0.05, 0.65, '#7df9ff', { seg: 10, alpha: 0.14, glow: true, two: true, noCap: true });
            for (let i = 0; i < 6; i++) {
                const k = (t * 0.4 + i / 6) % 1, a = i * 2.3 + t * 1.5;
                box(M, [Math.cos(a) * 0.14, 0.42 + k * 0.45, Math.sin(a) * 0.14], [0.02, 0.02, 0.02], '#e0fdff', { glow: true, alpha: Math.max(0.05, 1 - k) });
            }
        }
        return M;
    }

    // ---------- 寶物 ----------
    function buildChest(open) {
        const M = [], G = '#d4a017';
        box(M, [0, 0, 0], [0.5, 0.24, 0.32], '#8b5a2b');
        for (const s of [-1, 1]) box(M, [s * 0.17, 0, 0], [0.05, 0.245, 0.33], G);
        if (open) {
            sphere(M, [0, 0.2, 0], [0.22, 0.08, 0.13], '#f5c542', { seg: 10, rings: 6, half: true, glow: true });
            sphere(M, [0.08, 0.27, -0.03], [0.03, 0.04, 0.03], '#e74c3c', { seg: 6, rings: 4, glow: true });
        }
        const st = M.length;
        box(M, [0, 0.24, 0], [0.5, 0.1, 0.32], '#9c6631');
        for (const s of [-1, 1]) box(M, [s * 0.17, 0.24, 0], [0.05, 0.105, 0.33], G);
        box(M, [0, 0.2, -0.165], [0.07, 0.09, 0.02], '#f1c40f');
        if (open) xform(M, st, rotX(1.9, [0, 0.24, 0.16]));
        return M;
    }
    function buildPotion(t) {
        const M = [], y = 0.02 + 0.02 * Math.sin(t * 2);
        sphere(M, [0, y + 0.1, 0], [0.085, 0.075, 0.085], '#e0294a', { seg: 10, rings: 6 });
        sphere(M, [0, y + 0.11, 0], [0.11, 0.11, 0.11], '#cfe8ff', { seg: 10, rings: 7, alpha: 0.35 });
        frustum(M, [0, y + 0.2, 0], 0.04, 0.035, 0.07, '#cfe8ff', { seg: 8, alpha: 0.45 });
        box(M, [0, y + 0.265, 0], [0.06, 0.045, 0.06], '#a0703a');
        sphere(M, [-0.04, y + 0.15, -0.09], [0.015, 0.03, 0.01], '#ffffff', { seg: 5, rings: 3, glow: true, alpha: 0.8 });
        return M;
    }
    function buildKey(t) {
        const M = [], y = 0.14 + 0.02 * Math.sin(t * 2.5), G = '#f1c40f', n = 10, cx = -0.1, r = 0.055;
        for (let i = 0; i < n; i++) {
            const a0 = i / n * TAU, a1 = (i + 1) / n * TAU;
            beam(M, [cx + Math.cos(a0) * r, y + Math.sin(a0) * r, 0], [cx + Math.cos(a1) * r, y + Math.sin(a1) * r, 0], 0.025, G);
        }
        beam(M, [cx + r, y, 0], [0.17, y, 0], 0.028, G);
        beam(M, [0.11, y, 0], [0.11, y - 0.055, 0], 0.024, G);
        beam(M, [0.155, y, 0], [0.155, y - 0.045, 0], 0.024, G);
        return M;
    }

    // ---------- 機關 ----------
    function buildSpikes(t) {
        const M = [];
        box(M, [0, 0, 0], [0.62, 0.035, 0.62], '#3d4048');
        const e = Math.pow(Math.max(0, Math.sin(t * 2.2)), 0.4), h = 0.02 + 0.24 * e;
        for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
            box(M, [i * 0.18, 0.035, j * 0.18], [0.07, 0.004, 0.07], '#121316');
            frustum(M, [i * 0.18, 0.035, j * 0.18], 0.032, 0, h, '#cfd6dd', { seg: 6 });
        }
        return M;
    }
    function buildTeleport(t) {
        const M = [], P = '#a855f7';
        for (let i = 0; i < 16; i++) { const a = i / 16 * TAU + t * 0.8; box(M, [Math.cos(a) * 0.33, 0, Math.sin(a) * 0.33], [0.05, 0.02, 0.05], P, { glow: true }); }
        for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - t * 1.2; box(M, [Math.cos(a) * 0.2, 0, Math.sin(a) * 0.2], [0.035, 0.015, 0.035], '#e9d5ff', { glow: true }); }
        frustum(M, [0, 0, 0], 0.32, 0.26, 0.85, P, { seg: 14, alpha: 0.16, glow: true, two: true, noCap: true });
        for (let i = 0; i < 8; i++) {
            const k = (t * 0.35 + i / 8) % 1, a = i * 2.4 + t;
            box(M, [Math.cos(a) * 0.18, k * 0.8, Math.sin(a) * 0.18], [0.025, 0.025, 0.025], '#f5e8ff', { glow: true, alpha: Math.max(0.05, 1 - k) });
        }
        return M;
    }

    Object.assign(M3D.MODELS, {
        altar:     { name: '祭壇',       cat: 'altar', build: buildAltar,              face: 'world', sh: 0 },
        chest:     { name: '寶箱（關）', cat: 'item',  build: () => buildChest(false), face: 'world', sh: 0.3, zoom: 1.4 },
        chestOpen: { name: '寶箱（開）', cat: 'item',  build: () => buildChest(true),  face: 'world', sh: 0.3, zoom: 1.4 },
        potion:    { name: '補血藥水',   cat: 'item',  build: buildPotion,             face: 'spin',  sh: 0.1, zoom: 2.3 },
        key:       { name: '鑰匙',       cat: 'item',  build: buildKey,                face: 'spin',  sh: 0.12, zoom: 2.3 },
        spikes:    { name: '地刺陷阱',   cat: 'trap',  build: buildSpikes,             face: 'world', sh: 0, zoom: 1.3 },
        teleport:  { name: '傳送陣',     cat: 'trap',  build: buildTeleport,           face: 'world', sh: 0 },
    });
})();
